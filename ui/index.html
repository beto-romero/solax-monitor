<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SolaX</title>
</head>
<body>
<main class="page">
  <header class="topbar">
    <div class="identity">
      <h1>SolaX</h1>
      <p id="subtitle">X1-Mini-G4 on your local network</p>
    </div>
    <nav class="tabs" id="tabs" aria-label="Screens"></nav>
    <div class="topbar-status">
      <div class="pill fault-pill" id="fault-pill" role="status" hidden>
        <span class="dot"></span><span id="fault-pill-text">Fault</span><span id="fault-pill-codes"></span>
      </div>
      <div class="pill" id="status"><span class="dot"></span><span id="status-text">Connecting</span></div>
    </div>
  </header>
  <div id="screens"></div>
  <footer class="footer">
    <span class="footer-info">
      <span id="footer-note">Loading history.</span>
      <button type="button" class="footer-action" id="system-open"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span>System details</span></button>
    </span>
    <a class="footer-action" id="export" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg><span id="export-text">Download today as CSV</span></a>
  </footer>
  <!-- Icons from Lucide (lucide.dev), ISC licence. -->
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
